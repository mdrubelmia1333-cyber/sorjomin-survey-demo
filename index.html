/* ---------- প্রথমবার অনুমতি চাওয়া (ডেমোতে নয়) ---------- */
function maybeAskPermissions() {
  if (DB.mode === 'local' || !me() || $('#sheetBg').classList.contains('open')) return;
  try { if (localStorage.getItem('rj-perm-v1')) return; } catch (e) { return; }
  openSheet(L('অ্যাপ চালাতে অনুমতি দিন', 'Allow access'), `<p class="hint">${L('সরজমিনে GPS লোকেশন নেওয়া ও ছবি তোলার জন্য এই অনুমতিগুলো দরকার।', 'Needed to record GPS and take photos on site.')}</p>
    <div class="perm"><span class="ic">${ic('pin', 20)}</span><div class="tx"><b>${L('লোকেশন (Google Location)', 'Location')}</b>${L('ভবনের GPS কোড নিজে থেকে বসাতে', 'To fill the building’s GPS')}</div><button class="btn sm pri" id="pmLoc">${L('অনুমতি দিন', 'Allow')}</button></div>
    <div class="perm"><span class="ic">${ic('camera', 20)}</span><div class="tx"><b>${L('ক্যামেরা', 'Camera')}</b>${L('বর্তমান অবস্থার ছবি তুলতে', 'To photograph the site')}</div><button class="btn sm pri" id="pmCam">${L('অনুমতি দিন', 'Allow')}</button></div>
    <div class="acts"><button class="btn" id="pmDone">${L('সম্পন্ন', 'Done')}</button></div>`);
  const mark = (id, ok) => { const b = $(id); if (b) { b.textContent = ok ? L('দেওয়া হয়েছে', 'Allowed') : L('দেওয়া হয়নি', 'Not allowed'); b.disabled = true; b.className = 'btn sm ' + (ok ? 'ok' : ''); } };
  $('#pmLoc').onclick = () => locate().then(() => mark('#pmLoc', true), () => mark('#pmLoc', false));
  $('#pmCam').onclick = async () => {
    try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); mark('#pmCam', true); } catch (e) { mark('#pmCam', false); }
  };
  $('#pmDone').onclick = () => { try { localStorage.setItem('rj-perm-v1', '1'); } catch (e) { /* ignore */ } closeSheet(); };
}

   app.js — নেভিগেশন, পাতা বদল, শুরু (boot)

   ============================================================ */
'use strict';

const V = { name: 'loading', id: null, from: null };
let started = false;

const VIEWS = {
  auth: renderAuth, onboard: renderProfile, blocked: renderBlocked,
  home: renderHome, reports: renderReports, form: renderForm, detail: renderDetail,
  assign: renderAssign, assignForm: renderAssignForm, assignDetail: renderAssignDetail,
  stats: renderStats, groups: renderGroups, admin: renderAdmin, profile: renderProfile, about: renderAbout
};
/* যে পাতায় ফর্ম পূরণ চলছে, সেখানে অন্যের পরিবর্তনে পাতা নতুন করে আঁকা হয় না */
const EDITING = ['form', 'assignForm', 'profile', 'onboard', 'auth'];
const NAV_OF = { form: 'reports', detail: 'reports', assignForm: 'assign', assignDetail: 'assign', onboard: 'profile' };

function defaultView() {
  if (DB.mode === 'firebase' && !DB.me) return 'auth';
  if (isDisabled()) return 'blocked';
  return me() ? 'home' : 'onboard';
}

function go(name, id) {
  if (V.name === 'detail' && (name !== 'detail' || id !== V.id) && V.cUnsub) { V.cUnsub(); V.cUnsub = null; V.cFor = null; V.comments = null; }
  V.name = name; V.id = id || null;
  render(); window.scrollTo(0, 0);
}
async function goBack() {
  if (V.name === 'form') {
    await autoSave();
    if (V.rec && V.rec.status === 'submitted') { go('detail', V.rec.id); return; }
  }
  const fallback = { form: 'reports', detail: 'reports', assignForm: 'assign', assignDetail: 'assign' }[V.name] || 'home';
  let t = V.from;
  if (!t || t === V.name || ['form', 'detail', 'assignForm', 'assignDetail', 'onboard', 'auth'].includes(t)) t = fallback;
  V.from = null; go(t);
}

function onData() {
  if (!started) return;
  if (V.name === 'onboard' && me()) { go('home'); return; }
  if (V.name === 'blocked' && !isDisabled()) { go(defaultView()); return; }
  if (isDisabled() && V.name !== 'blocked') { go('blocked'); return; }
  clearTimeout(onData.t);
  onData.t = setTimeout(() => {
    if (EDITING.includes(V.name)) { renderNav(); return; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }, 120);
}

/* ---------- নেভিগেশন ---------- */
function navItems() {
  const items = [['home', L('ড্যাশবোর্ড', 'Dashboard'), 'var(--blue)'], ['assign', L('অ্যাসাইনমেন্ট', 'Assignments'), 'var(--orange)'], ['reports', L('রিপোর্ট', 'Reports'), 'var(--blue)'],
    ['stats', L('পরিসংখ্যান', 'Statistics'), 'var(--green)'], ['groups', L('গ্রুপ', 'Groups'), 'var(--teal)']];
  if (isDev()) items.push(['admin', L('নিয়ন্ত্রণ প্যানেল', 'Control panel'), 'var(--purple)']);
  items.push(['profile', L('প্রোফাইল', 'Profile'), 'var(--slate)'], ['about', L('অ্যাপ সম্পর্কে', 'About'), 'var(--slate)']);
  return items;
}
function navCounts() {
  return {
    assign: myOpenAssignments().length,
    reports: isOfficer() ? Object.values(DB.data.reports).filter(r => r.authorId !== DB.me && r.status === 'submitted' && canSee(r) && ['new', 'resub'].includes(reviewState(r))).length : 0

function renderNav() {
  const nav = $('#nav'), show = started && me() && !['auth', 'blocked'].includes(V.name) && !(DB.mode === 'firebase' && !DB.me);
  nav.hidden = !show; $('#meBtn').hidden = !show;

  const cur = NAV_OF[V.name] || V.name, items = navItems(), cnt = navCounts(), mobileMain = ['home', 'assign', 'reports', 'stats'];
  const btn = ([k, n, c], cls) => `<button class="ni ${cls}" data-nav="${k}" style="--nc:${c}" ${cur === k ? 'aria-current="page"' : ''}>${ic(k, 22)}<span class="t">${esc(n)}</span>${cnt[k] ? `<span class="cnt">${fmt(cnt[k])}</span>` : ''}</button>`;
  const moreActive = !mobileMain.includes(cur);
  nav.innerHTML = items.map(it => btn(it, mobileMain.includes(it[0]) ? '' : 'desk-only')).join('') +
    `<button class="ni mob-only" data-more="1" style="--nc:var(--slate)" ${moreActive ? 'aria-current="page"' : ''}>${ic('more', 22)}<span class="t">${L('আরও', 'More')}</span></button>
     <div class="credit">Developed by <b>${esc(APP.developer)}</b><br>${esc(APP.company)}</div>`;
  nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navTo(b.dataset.nav));

    openSheet(L('আরও', 'More'), `<div class="moregrid">${items.filter(it => !mobileMain.includes(it[0])).map(([k, n, c]) => `<button data-nav2="${k}" style="--nc:${c}">${ic(k, 22)}${esc(n)}</button>`).join('')}

      <div class="credit-line">Developed by <b>${esc(APP.developer)}</b><br>${esc(APP.company)}</div>`);
    $$('[data-nav2]').forEach(b => b.onclick = () => { closeSheet(); navTo(b.dataset.nav2); });
    $('[data-lang2]').onclick = () => { closeSheet(); setLang(lang === 'bn' ? 'en' : 'bn'); };
  };
  const p = me(); $('#meBtn').innerHTML = avatarFrom(p, 32);

async function navTo(k) { if (V.name === 'form') await autoSave(); V.from = null; go(k); }

/* ---------- পাতা আঁকা ---------- */
function render() {
  document.documentElement.lang = lang;
  $('#appName').textContent = L(APP.nameBn, APP.nameEn);
  $('#appOrg').textContent = L(APP.orgBn, APP.orgEn);
  $('#langBtn').textContent = lang === 'bn' ? 'English' : 'বাংলা';
  if (!started) return;
  if (DB.mode === 'firebase' && !DB.me) V.name = 'auth';
  else if (isDisabled()) V.name = 'blocked';
  else if (!me() && V.name !== 'onboard') V.name = 'onboard';
  else if (V.name === 'admin' && !isDev()) V.name = 'home';
  $('#cmd').hidden = false;
  renderNav();
  try { (VIEWS[V.name] || renderHome)(); }
  catch (e) { console.error(e); $('#content').innerHTML = `<div class="banner bad">${L('পাতাটি দেখাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।', 'This page could not be shown. Please try again.')}</div>`; }
  DB.hydrate();
  if (V.name === 'home') maybeAskPermissions();
}

function setLang(x) { lang = x; try { localStorage.setItem('rj-lang', x); } catch (e) { /* ignore */ } const y = window.scrollY; render(); window.scrollTo(0, y); }
function setTheme(t) {
  try { localStorage.setItem('rj-theme', t); } catch (e) { /* ignore */ }
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  if (V.name === 'profile') render();
}
(function applyTheme() { try { const t = localStorage.getItem('rj-theme'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ } })();

/* নিষ্ক্রিয় থাকলে স্বয়ংক্রিয় লগআউট (Firebase) */
function idleWatch() {
  if (DB.mode !== 'firebase' || !IDLE_LOGOUT_MINUTES) return;
  let t; const reset = () => { clearTimeout(t); t = setTimeout(async () => { if (DB.me) { await autoSave(); DB.auth.signOut(); toast(L('নিরাপত্তার জন্য লগআউট করা হয়েছে', 'Signed out for security')); } }, IDLE_LOGOUT_MINUTES * 60000); };
  ['pointerdown', 'keydown', 'scroll'].forEach(ev => window.addEventListener(ev, reset, { passive: true })); reset();
}

/* ---------- শুরু ---------- */
(async function boot() {
  $('#logo').innerHTML = LOGO;
  render();
  $('#langBtn').onclick = () => setLang(lang === 'bn' ? 'en' : 'bn');
  $('#meBtn').onclick = () => navTo('profile');
  $('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  window.addEventListener('beforeunload', e => { if (V.name === 'form' && V.dirty) { e.preventDefault(); e.returnValue = ''; } });
  let ok = false;
  if (window.claude && typeof window.claude.use === 'function') ok = await DB.connectClaude();
  if (!ok && FIREBASE_CONFIG) ok = await DB.connectFirebase();
  if (!ok) await DB.useLocal();
  started = true;
  V.name = defaultView();
  render();
  idleWatch();
})();

</script>
