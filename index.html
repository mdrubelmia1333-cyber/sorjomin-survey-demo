<!DOCTYPE html>
<!--
  সরজমিন জরিপ — রাজউক পরিদর্শন ব্যবস্থাপনা
  Developed by Md Rubel Mia | © 2026 Digitalaxis Tech
-->
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294B">
<meta name="description" content="সরজমিন জরিপ — রাজউক পরিদর্শন ব্যবস্থাপনা | Developed by Md Rubel Mia, Digitalaxis Tech">
<meta name="author" content="Md Rubel Mia, Digitalaxis Tech">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>সরজমিন জরিপ — রাজউক</title>
<style>
/* ============================================================
   সরজমিন জরিপ — স্টাইল (অফিস অ্যাপ্লিকেশনের মতো সাজানো)
   Developed by Md Rubel Mia — Digitalaxis Tech
   রং বদলাতে নিচের :root এর মানগুলো বদলান।
   ============================================================ */
:root{
  --font: Arial, "Noto Sans Bengali", "Nirmala UI", "Vrinda", "Shonar Bangla", Helvetica, sans-serif;
  --appbar:#13294B; --appbar-ink:#FFFFFF;
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#1B2433; --muted:#5B6980; --line:#D5DCE7; --line2:#E6EBF2;
  --blue:#2B579A; --orange:#C55A11; --green:#217346; --teal:#0E7C86; --purple:#6B3FA0; --slate:#4A5A70;
  --red:#C42B1C; --red-bg:#FDECEA; --amber:#8F5B00; --amber-bg:#FFF3D1; --ok:#1E7B45; --ok-bg:#E2F3E8; --info-bg:#E7EFFA;
  --mark:#FFE27A; --mark-ink:#1B2433;
  --accent:var(--blue); --accent-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 3px 10px rgba(16,32,64,.05);
  --r:6px; --appbar-h:56px; --nav-w:248px; --bnav-h:60px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --appbar:#0A1830; --bg:#0F1726; --surface:#172238; --surface2:#1B2840; --ink:#E7EDF7; --muted:#9DAAC0; --line:#2A3A57; --line2:#223048;
  --blue:#6E9DE0; --orange:#F0954F; --green:#5BBE85; --teal:#4CC3CC; --purple:#B193E6; --slate:#A9B6CB;
  --red:#F2786A; --red-bg:#3D1F1D; --amber:#EAB94F; --amber-bg:#3A2D12; --ok:#64C98D; --ok-bg:#163326; --info-bg:#1C2D4A;
  --mark:#8A6C10; --mark-ink:#FFF7DA; --accent-ink:#0F1726; color-scheme:dark; } }
:root[data-theme="dark"]{
  --appbar:#0A1830; --bg:#0F1726; --surface:#172238; --surface2:#1B2840; --ink:#E7EDF7; --muted:#9DAAC0; --line:#2A3A57; --line2:#223048;
  --blue:#6E9DE0; --orange:#F0954F; --green:#5BBE85; --teal:#4CC3CC; --purple:#B193E6; --slate:#A9B6CB;
  --red:#F2786A; --red-bg:#3D1F1D; --amber:#EAB94F; --amber-bg:#3A2D12; --ok:#64C98D; --ok-bg:#163326; --info-bg:#1C2D4A;
  --mark:#8A6C10; --mark-ink:#FFF7DA; --accent-ink:#0F1726; color-scheme:dark; }

/* প্রতিটা অংশের নিজস্ব রং (Word নীল, Excel সবুজ ইত্যাদির মতো) */
[data-mod="home"]{--accent:var(--blue)} [data-mod="reports"]{--accent:var(--blue)} [data-mod="assign"]{--accent:var(--orange)}
[data-mod="stats"]{--accent:var(--green)} [data-mod="groups"]{--accent:var(--teal)} [data-mod="admin"]{--accent:var(--purple)}
[data-mod="profile"],[data-mod="about"]{--accent:var(--slate)}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--appbar)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- অ্যাপ বার ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:var(--appbar-h);background:var(--appbar);color:var(--appbar-ink);display:flex;align-items:center;gap:12px;padding:0 14px}
.logo{width:34px;height:34px;border-radius:6px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{display:block}
.appname{min-width:0;line-height:1.2}
.appname b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appname span{display:block;font-size:.74rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sp{flex:1}
.abtn{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--appbar-ink);border-radius:5px;padding:5px 10px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.abtn:hover{background:rgba(255,255,255,.1)}
.meav{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}

/* ---------- নেভিগেশন ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:3px 2px calc(3px + env(safe-area-inset-bottom,0px))}
.nav .ni{flex:1;background:none;border:0;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;position:relative;border-radius:6px;min-width:0}
.nav .ni svg{width:22px;height:22px;flex:none}
.nav .ni span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav .ni[aria-current="page"]{color:var(--ink);font-weight:bold}
.nav .ni[aria-current="page"] svg{color:var(--nc)}
.nav .ni .cnt{position:absolute;top:1px;left:calc(50% + 7px);background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:1.55;font-weight:bold}
.nav .desk-only,.nav .credit{display:none}
main{padding-bottom:calc(var(--bnav-h) + 24px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){
  .nav{top:calc(env(safe-area-inset-top,0px) + var(--appbar-h));bottom:0;right:auto;width:var(--nav-w);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 10px;gap:2px;overflow:auto}
  .nav .ni{flex:none;flex-direction:row;gap:12px;font-size:.93rem;padding:9px 12px;justify-content:flex-start;border-left:3px solid transparent;border-radius:0 6px 6px 0}
  .nav .ni[aria-current="page"]{background:var(--surface2);border-left-color:var(--nc)}
  .nav .ni .cnt{position:static;margin-left:auto}
  .nav .mob-only{display:none}
  .nav .desk-only{display:flex}
  .nav .credit{display:block;margin-top:auto;padding:14px 12px 4px;font-size:.74rem;color:var(--muted);border-top:1px solid var(--line2);line-height:1.5}
  main{margin-left:var(--nav-w);padding-bottom:40px}
}

/* ---------- কমান্ড বার (রিবনের মতো) ---------- */
.cmdbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--appbar-h));z-index:15;background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--accent);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:54px}
.cmdbar .back{background:none;border:1px solid var(--line);border-radius:5px;width:34px;height:34px;cursor:pointer;flex:none;display:grid;place-items:center}
.cmdbar .ttl{min-width:0;flex:1 1 160px}
.cmdbar h1{font-size:1.12rem;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdbar .sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdbar .acts{display:flex;gap:6px;flex-wrap:wrap}
.content{padding:16px 14px;max-width:1120px;margin:0 auto}

/* ---------- বাটন ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:5px;padding:8px 14px;font-weight:bold;font-size:.88rem;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);min-height:38px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.82rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:bold;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- কার্ড ও লেআউট ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card>h3,.card .h3{font-size:1rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card>h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}
.hint{margin:0 0 12px;color:var(--muted);font-size:.84rem}
.cols{display:grid;gap:14px}
@media (min-width:960px){.cols.c2{grid-template-columns:1fr 1fr}.cols.c21{grid-template-columns:2fr 1fr}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (min-width:700px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.l{font-size:.82rem;color:var(--muted);font-weight:bold}
.req{color:var(--red)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--accent);flex:none}
textarea{min-height:84px;resize:vertical}
input:disabled,select:disabled{opacity:.6}

/* KPI কার্ড */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--kc,var(--accent));border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);text-align:left;cursor:default}
button.kpi{cursor:pointer;width:100%}
.kpi .v{font-size:1.65rem;font-weight:bold;line-height:1.1;color:var(--kc,var(--ink))}
.kpi .k{font-size:.8rem;color:var(--muted);margin-top:4px}
.kpi .s{font-size:.74rem;color:var(--muted);margin-top:2px}

/* ব্যানার */
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.banner.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--blue) 25%,transparent)}
.banner.warn{background:var(--amber-bg);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 25%,transparent)}
.banner.bad{background:var(--red-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.banner.good{background:var(--ok-bg);color:var(--ok)}

/* সেগমেন্ট ও চিপ */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface);margin-bottom:12px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-size:.86rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:bold}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:transparent}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px}

/* পিল ব্যাজ */
.pill{display:inline-block;font-size:.72rem;border-radius:999px;padding:2px 8px;white-space:nowrap;font-weight:bold;line-height:1.5}
.p-red{background:var(--red-bg);color:var(--red)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-amber{background:var(--amber-bg);color:var(--amber)}
.p-info{background:var(--info-bg);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
.p-orange{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)} .p-purple{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}

/* তালিকা সারি */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.row:hover{background:var(--surface2)}
.row.red{border-left-color:var(--red);background:color-mix(in srgb,var(--red-bg) 55%,var(--surface))}
.row.ok{border-left-color:var(--ok)} .row.amber{border-left-color:var(--amber)} .row.orange{border-left-color:var(--orange)} .row.blue{border-left-color:var(--blue)}
.row .main{min-width:0}
.row .t1{font-weight:bold;font-size:.97rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:.82rem;color:var(--muted);margin-top:1px}
.row .t3{font-size:.74rem;color:var(--muted);margin-top:2px;word-break:break-all}
.row .side{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center}
.empty b{display:block;font-size:1.02rem;margin-bottom:4px}
.empty p{margin:0 0 12px;color:var(--muted);font-size:.9rem}

/* অবতার */
.av{border-radius:50%;background:var(--slate);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover}

/* টেবিল */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
table.tbl th,table.tbl td{padding:8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.tbl th{background:var(--surface2);color:var(--muted);font-size:.76rem;font-weight:bold;position:sticky;top:0}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl tr.tot td{font-weight:bold;border-top:2px solid var(--line)}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:7px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:bold;word-break:break-word}

/* তুলনা সারি */
.cmp-head,.cmp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.cmp-head{font-size:.76rem;color:var(--muted);font-weight:bold;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:6px}
.cmp{padding:6px 0;border-bottom:1px dashed var(--line2)}
.cmp:last-child{border-bottom:0}
.cmp .nm{font-weight:bold;font-size:.9rem;line-height:1.25}
.cmp .nm small{display:block;color:var(--muted);font-weight:normal;font-size:.74rem}
.cmp .res{grid-column:2/-1;font-size:.79rem;font-weight:bold}
.res.bad{color:var(--red)} .res.good{color:var(--ok)} .res.none{color:var(--muted);font-weight:normal}
.xbtn{background:none;border:0;color:var(--red);cursor:pointer;font-size:.78rem;text-align:left;padding:0}
.road{border:1px solid var(--line2);border-radius:5px;padding:10px;margin-bottom:8px;background:var(--surface2)}
.road .tg{display:flex;align-items:center;gap:10px;font-weight:bold;cursor:pointer}
.road .grid{margin-top:8px}
.diagram{background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:8px;display:flex;justify-content:center;margin:10px 0}
.diagram svg{width:100%;max-width:380px;height:auto}
.gpsrow{display:flex;gap:8px}
.gpsrow input{flex:1;font-weight:bold}
.gpsmsg{font-size:.82rem;color:var(--muted);margin-top:6px}
.gpsmsg.err{color:var(--red)}
a.lnk{color:var(--accent);font-weight:bold}

/* ছবি */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.ph{background:var(--surface2);border:1px solid var(--line2);border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
.ph .img{aspect-ratio:4/3;background:var(--line2);display:block;width:100%;border:0;padding:0;cursor:pointer}
.ph .img img{width:100%;height:100%;object-fit:cover;display:block}
.ph .meta{padding:6px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ph .meta input{min-height:30px;padding:4px 6px;font-size:.8rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fileitem{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line2);border-radius:5px;background:var(--surface2);font-size:.85rem}
.fileitem img{width:44px;height:44px;object-fit:cover;border-radius:4px}

/* রিচ টেক্সট */
.rte{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.rte:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.rte-bar{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line2);background:var(--surface2)}
.rte-bar button{min-width:34px;height:30px;border:1px solid transparent;background:none;border-radius:4px;cursor:pointer;font-size:.9rem}
.rte-bar button:hover{border-color:var(--line);background:var(--surface)}
.rte-bar .sep{width:1px;background:var(--line);margin:4px 4px}
.rte-bar .hint2{margin-left:auto;font-size:.72rem;color:var(--muted);align-self:center;padding-right:4px}
.rte textarea{border:0;border-radius:0;box-shadow:none!important}
.rte-prev{border-top:1px dashed var(--line2);padding:6px 10px;font-size:.86rem;white-space:pre-wrap;background:var(--surface2)}
.rte-prev:empty{display:none}
.rt{white-space:pre-wrap;word-break:break-word}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}

/* সারাংশ */
.verdict{border-radius:5px;padding:10px 14px;margin-bottom:10px;font-weight:bold}
.v-bad{background:var(--red-bg);color:var(--red)} .v-good{background:var(--ok-bg);color:var(--ok)} .v-none{background:var(--surface2);color:var(--muted)}
ul.iss{margin:0;padding-left:20px} ul.iss li{margin:3px 0}

/* রিপোর্ট হেডার */
.rhead{background:var(--appbar);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px}
.rhead .lbl{font-size:.74rem;opacity:.75}
.rhead .fno{font-size:1.05rem;font-weight:bold;word-break:break-all}
.rhead .by{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.88rem}
.rhead .by small{opacity:.8}
.rhead .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* মন্তব্যের টাইমলাইন */
.tl{display:flex;flex-direction:column;gap:12px}
.tli{display:grid;grid-template-columns:34px 1fr;gap:10px}
.tli .bx{background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:9px 11px}
.tli .who{font-weight:bold;font-size:.88rem}
.tli .who small{color:var(--muted);font-weight:normal}
.tli .tx{margin:4px 0 0}
.tli .tm{font-size:.74rem;color:var(--muted);margin-top:4px}

/* চার্ট */
.chart{max-width:820px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ব্যবহারকারী পিকার */
.picker{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:5px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--surface2)}
.pick .nm{font-weight:bold;font-size:.88rem}
.pick .ds{font-size:.76rem;color:var(--muted)}

/* শিট / ডায়ালগ */
.toast{position:fixed;left:50%;bottom:calc(var(--bnav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--appbar);color:#fff;padding:9px 16px;border-radius:6px;font-size:.88rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1}
@media (min-width:960px){.toast{bottom:24px;left:calc(50% + var(--nav-w)/2)}}
.sheet-bg{position:fixed;inset:0;background:rgba(8,16,32,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:10px 10px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;border-top:3px solid var(--accent)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:8px}}
.sheet h2{font-size:1.08rem;margin:0 0 12px}
.sheet textarea.rep{min-height:300px;font-size:.84rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.moregrid button{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;text-align:left;font-weight:bold}
.moregrid svg{width:22px;height:22px;color:var(--nc)}

/* লগইন পাতা */
.authwrap{min-height:calc(100vh - var(--appbar-h));display:flex;align-items:center;justify-content:center;padding:24px 14px;background:linear-gradient(180deg,var(--appbar) 0,var(--appbar) 190px,var(--bg) 190px)}
.authcard{background:var(--surface);border-radius:8px;box-shadow:0 8px 30px rgba(10,24,48,.18);width:100%;max-width:430px;padding:24px 20px;border-top:4px solid var(--blue)}
.authcard h1{font-size:1.3rem;margin:0 0 2px}
.authcard .sub{color:var(--muted);font-size:.86rem;margin-bottom:16px}
.credit-line{text-align:center;font-size:.76rem;color:var(--muted);margin-top:18px;line-height:1.6}
.perm{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.perm .ic{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;background:var(--info-bg);color:var(--blue);flex:none}
.perm .tx{flex:1;font-size:.86rem}
.perm .tx b{display:block;font-size:.92rem}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.about-hero{background:var(--appbar);color:#fff;border-radius:var(--r);padding:22px;margin-bottom:14px;display:flex;gap:16px;align-items:center}
.about-hero .logo{width:56px;height:56px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{.appbar,.nav,.cmdbar .acts,.toast{display:none!important}main{margin:0!important}}

  return p + Date.now().toString(36) + [...a].map(x => x.toString(16).padStart(2, '0')).join('');

/* ============================================================
   calc.js — অনুমোদিত বনাম সরজমিন হিসাব, বিচ্যুতি, জমির নকশা
   dir:'over'  = অনুমোদনের চেয়ে বেশি হলে বিচ্যুতি
   dir:'under' = অনুমোদনের চেয়ে কম হলে বিচ্যুতি

'use strict';

const UNITS = () => ({ m: { len: L('মি', 'm'), area: L('বর্গমি', 'sq m') }, ft: { len: L('ফুট', 'ft'), area: L('বর্গফুট', 'sq ft') } });
const unitsOf = r => UNITS()[r && r.unit === 'ft' ? 'ft' : 'm'];
const CMP = () => [
  { k: 'floors',   n: L('তলা সংখ্যা', 'Storeys'), kind: 'count', u: L('তলা', 'storey'), dir: 'over' },
  { k: 'basement', n: L('বেসমেন্ট', 'Basements'), kind: 'count', u: L('টি', 'nos'), dir: 'over' },
  { k: 'sb_front', n: L('সেটব্যাক — সামনে', 'Setback — front'), kind: 'len', dir: 'under' },
  { k: 'sb_back',  n: L('সেটব্যাক — পেছনে', 'Setback — rear'), kind: 'len', dir: 'under' },
  { k: 'sb_left',  n: L('সেটব্যাক — বামে', 'Setback — left'), kind: 'len', dir: 'under' },
  { k: 'sb_right', n: L('সেটব্যাক — ডানে', 'Setback — right'), kind: 'len', dir: 'under' },
  { k: 'gc',       n: L('গ্রাউন্ড কভারেজ', 'Ground coverage'), sub: L('নিচতলার ক্ষেত্রফল', 'ground floor area'), kind: 'area', dir: 'over' },
  { k: 'tfa',      n: L('মোট ফ্লোর এরিয়া', 'Total floor area'), sub: L('সব তলা মিলিয়ে', 'all floors'), kind: 'area', dir: 'over' },
  { k: 'parking',  n: L('পার্কিং', 'Parking'), kind: 'count', u: L('টি', 'spaces'), dir: 'under' },
];
const cmpByKey = k => CMP().find(c => c.k === k);
const unitOf = (c, r) => (c.kind === 'count' ? c.u : unitsOf(r)[c.kind]);

function diff(a, m, dir, u, isArea) {
  if (a == null || m == null) return { s: 'none', t: L('দুটো মান দিলে হিসাব হবে', 'Enter both values') };
  const d = m - a;
  if (Math.abs(d) < 1e-9) return { s: 'good', t: L('অনুমোদন অনুযায়ী', 'As approved'), a, m };
  const bad = dir === 'over' ? d > 0 : d < 0;
  const pct = isArea && a ? ` (${fmt(Math.abs(d) / a * 100)}%)` : '';
  return { s: bad ? 'bad' : 'good', t: `${fmt(Math.abs(d))} ${u} ${d > 0 ? L('বেশি', 'more') : L('কম', 'less')}${pct}`, a, m };
}

/* তলাভিত্তিক ক্ষেত্রফলের যোগফল */
function floorSum(r) {
  let a = null, m = null;
  (r.floorsList || []).forEach(f => { const x = num(f.a), y = num(f.m); if (x != null) a = (a || 0) + x; if (y != null) m = (m || 0) + y; });
  return { a, m };
}
/* মোট ফ্লোর এরিয়া: আলাদা করে লিখলে সেটা, না লিখলে তলাগুলোর যোগফল */
function cmpVals(c, r) {
  if (c.k === 'tfa') { const s = floorSum(r); return [num(r.tfaA) ?? s.a, num(r.tfaM) ?? s.m]; }
  return [num(r[c.k + 'A']), num(r[c.k + 'M'])];
}
const compare = (c, r) => { const [a, m] = cmpVals(c, r); return diff(a, m, c.dir, unitOf(c, r), c.kind === 'area'); };
const roadCmp = (side, r) => { const x = (r.roads || {})[side] || {}; return diff(num(x.a), num(x.m), 'under', unitsOf(r).len, false); };
const floorCmp = (f, r) => diff(num(f.a), num(f.m), 'over', unitsOf(r).area, true);

function issues(r) {
  const out = [];
  CMP().forEach(c => { const d = compare(c, r); if (d.s === 'bad') out.push(`${c.n}: ${L('অনুমোদিত', 'approved')} ${fmt(d.a)}, ${L('সরজমিন', 'on site')} ${fmt(d.m)} ${unitOf(c, r)} — ${d.t}`); });
  SIDES.forEach(s => {
    const x = (r.roads || {})[s.v]; if (!x || !x.on) return; const d = roadCmp(s.v, r);
    if (d.s === 'bad') out.push(`${L('রাস্তা', 'Road')} (${L(s.b, s.e)}): ${L('নকশায়', 'plan')} ${fmt(d.a)}, ${L('সরজমিন', 'on site')} ${fmt(d.m)} — ${d.t}`);
  });
  (r.floorsList || []).forEach(f => { const d = floorCmp(f, r); if (d.s === 'bad') out.push(`${f.name || L('তলা', 'Floor')}: ${L('অনুমোদিত', 'approved')} ${fmt(d.a)}, ${L('সরজমিন', 'on site')} ${fmt(d.m)} ${unitsOf(r).area} — ${d.t}`); });
  if (r.btypeA && r.btypeM && r.btypeA !== r.btypeM) out.push(`${L('ভবনের শ্রেণি পরিবর্তন', 'Change of building type')}: ${r.btypeA} → ${r.btypeM}`);
  if (r.useA && r.useM && r.useA !== r.useM) out.push(`${L('ব্যবহার পরিবর্তন', 'Change of use')}: ${O(USES, r.useA)} → ${O(USES, r.useM)}`);
  return out;
}
const hasMeasure = r => CMP().some(c => compare(c, r).s !== 'none') || SIDES.some(s => roadCmp(s.v, r).s !== 'none') ||
  !!(r.useA && r.useM) || !!(r.btypeA && r.btypeM) || (r.floorsList || []).some(f => num(f.a) != null && num(f.m) != null);

function floorName(i, basements) {
  if (i < basements) { const n = basements - i; return L('বেসমেন্ট-' + (BD[n] || fmt(n)), 'Basement ' + n); }
  const n = i - basements;
  if (n === 0) return L('নিচতলা', 'Ground floor');
  const bnOrd = ['', '১ম', '২য়', '৩য়', '৪র্থ', '৫ম', '৬ষ্ঠ', '৭ম', '৮ম', '৯ম', '১০ম'];
  const en = n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
  return L((bnOrd[n] || fmt(n) + 'তম') + ' তলা', en + ' floor');
}

/* GPS: এক বক্সে "অক্ষাংশ, দ্রাঘিমাংশ" */
function parseGps(s) {
  const m = asciiDigits(s).match(/(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) return null; const lat = +m[1], lng = +m[2];
  return (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) ? { lat, lng } : null;
}
const mapUrl = g => `https://www.google.com/maps?q=${g.lat},${g.lng}`;

/* জমির আকৃতির নকশা (SVG) — নিচের দিক = সামনে */
const SHAPE_PTS = {
  rect: [[0, 0], [1, 0], [1, 1], [0, 1]], square: [[.08, 0], [.92, 0], [.92, 1], [.08, 1]],
  L: [[0, 0], [.55, 0], [.55, .42], [1, .42], [1, 1], [0, 1]], tri: [[.5, 0], [1, 1], [0, 1]],
  trap: [[.22, 0], [.78, 0], [1, 1], [0, 1]], irr: [[.1, 0], [.72, .07], [1, .5], [.88, 1], [0, .92], [.05, .45]] };
function diagramSVG(r) {
  const bx = 62, by = 46, bw = 196, bh = 176;
  const P = (SHAPE_PTS[r.shape] || SHAPE_PTS.rect).map(([x, y]) => [bx + x * bw, by + y * bh]);
  const cx = P.reduce((s, p) => s + p[0], 0) / P.length, cy = P.reduce((s, p) => s + p[1], 0) / P.length;
  const B = P.map(([x, y]) => [cx + (x - cx) * .5, cy + (y - cy) * .5]);
  const xs = B.map(p => p[0]), ys = B.map(p => p[1]);
  const b = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  const u = unitsOf(r).len, pts = a => a.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  const sb = k => {
    const c = cmpByKey(k), d = compare(c, r), m = num(r[k + 'M']), a = num(r[k + 'A']);
    return { col: d.s === 'bad' ? 'var(--red)' : d.s === 'good' ? 'var(--ok)' : 'var(--muted)', t: m != null ? fmt(m) + ' ' + u : (a != null ? '(' + fmt(a) + ')' : '?'), s: (a != null && m != null) ? L('অনু. ', 'appr. ') + fmt(a) : '' };
  };
  const lab = (x, y, o) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="bold" fill="${o.col}">${esc(o.t)}</text>${o.s ? `<text x="${x.toFixed(1)}" y="${(y + 13).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(o.s)}</text>` : ''}`;
  const road = s => {
    const x = (r.roads || {})[s]; if (!x || !x.on) return '';
    const sd = SIDES.find(z => z.v === s), w = num(x.m) ?? num(x.a);
    const t = esc(L(sd.b + 'র রাস্তা', sd.e + ' road') + (w != null ? ' ' + fmt(w) + ' ' + u : ''));
    const col = roadCmp(s, r).s === 'bad' ? 'var(--red)' : 'var(--ink)';
    if (s === 'front') return `<rect x="20" y="234" width="280" height="26" fill="var(--line)"/><text x="160" y="251" text-anchor="middle" font-size="11" fill="${col}">${t}</text>`;
    if (s === 'back') return `<rect x="20" y="8" width="280" height="26" fill="var(--line)"/><text x="160" y="25" text-anchor="middle" font-size="11" fill="${col}">${t}</text>`;
    if (s === 'left') return `<rect x="16" y="40" width="26" height="188" fill="var(--line)"/><text x="29" y="134" text-anchor="middle" font-size="11" fill="${col}" transform="rotate(-90 29 134)">${t}</text>`;
    return `<rect x="278" y="40" width="26" height="188" fill="var(--line)"/><text x="291" y="134" text-anchor="middle" font-size="11" fill="${col}" transform="rotate(90 291 134)">${t}</text>`;
  };

    <polygon points="${pts(B)}" fill="var(--info-bg)" stroke="var(--ink)" stroke-width="2"/>
    <text x="${cx.toFixed(1)}" y="${(cy + 2).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--ink)">${L('ভবন', 'Building')}</text>
    ${fl != null ? `<text x="${cx.toFixed(1)}" y="${(cy + 17).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmt(fl)} ${L('তলা', 'storeys')}</text>` : ''}
    ${lab((b.x0 + b.x1) / 2, (b.y1 + by + bh) / 2 + 2, sb('sb_front'))}

    ${lab((bx + b.x0) / 2, (b.y0 + b.y1) / 2 - 4, sb('sb_left'))}
    ${lab((bx + bw + b.x1) / 2, (b.y0 + b.y1) / 2 - 4, sb('sb_right'))}
    <text x="160" y="281" text-anchor="middle" font-size="10.5" fill="var(--muted)">${L('নিচের দিক = সামনে', 'Bottom = front')}${r.facing ? ' (' + esc(O(FACING, r.facing)) + ')' : ''} | ${esc(O(SHAPES, r.shape || 'rect'))}</text>
  </svg>`;
}

/* ============================================================
   store.js — ডেটা সংরক্ষণ ও ভূমিকা (role)
   তিনটি মোড, একই কোড:
     cloud    — Claude-এর ভেতরে (Claude অ্যাকাউন্ট)
     firebase — নিজের সার্ভার / প্লে স্টোর / অ্যাপ স্টোর (ইমেইল/ফোন + পাসওয়ার্ড)
     local    — ডেমো, শুধু এই ডিভাইসে
   কালেকশন: profiles, roles, contacts, groups, settings,
            reports (+ reports/<id>/comments), assignments, photos

'use strict';

/* ---------- ডেমো মোডের ছোট ডাটাবেস (Firestore-এর মতো একই ভাষায় কাজ করে) ---------- */
function snapDoc(id, d) { return { id, exists: !!d, data: () => (d ? JSON.parse(JSON.stringify(d)) : undefined) }; }
class LocalStore {
  constructor(key) { this.key = key; this.docs = {}; this.ls = new Set(); try { this.docs = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { this.docs = {}; } }
  _save() { try { localStorage.setItem(this.key, JSON.stringify(this.docs)); } catch (e) { const er = new Error('full'); er.code = 'quota_exceeded'; throw er; } }
  _emit() { [...this.ls].forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
  collection(path) { return new LQuery(this, path, []); }
  doc(path) { return new LDoc(this, path); }
}
class LDoc {
  constructor(s, path) { this.s = s; this.path = path; this.id = path.split('/').pop(); }
  async get() { return snapDoc(this.id, this.s.docs[this.path]); }
  async set(data) { const old = this.s.docs[this.path]; this.s.docs[this.path] = JSON.parse(JSON.stringify(data)); try { this.s._save(); } catch (e) { if (old) this.s.docs[this.path] = old; else delete this.s.docs[this.path]; throw e; } this.s._emit(); }
  async update(f) { const cur = this.s.docs[this.path]; if (!cur) { const e = new Error('missing'); e.code = 'invalid_argument'; throw e; } await this.set(Object.assign({}, cur, JSON.parse(JSON.stringify(f)))); }
  async delete() { delete this.s.docs[this.path]; this.s._save(); this.s._emit(); }
  collection(p) { return new LQuery(this.s, this.path + '/' + p, []); }
}
class LQuery {
  constructor(s, path, f) { this.s = s; this.path = path; this.f = f; }
  where(field, op, val) { return new LQuery(this.s, this.path, [...this.f, [field, op, val]]); }
  orderBy() { return this; }
  limit() { return this; }
  doc(id) { return new LDoc(this.s, this.path + '/' + (id || newId('d'))); }
  async add(data) { const d = this.doc(); await d.set(data); return d; }
  _run() {
    const pre = this.path + '/', out = [];
    for (const [k, v] of Object.entries(this.s.docs)) {
      if (!k.startsWith(pre)) continue;
      const id = k.slice(pre.length); if (id.includes('/')) continue;
      const ok = this.f.every(([fi, op, val]) => {
        const x = v[fi];
        if (op === '==') return x === val; if (op === '!=') return x !== val;
        if (op === 'array-contains') return Array.isArray(x) && x.includes(val);
        if (op === 'in') return Array.isArray(val) && val.includes(x);
        return true;
      });
      if (ok) out.push(snapDoc(id, v));
    }
    return { docs: out, size: out.length, empty: !out.length };
  }
  async get() { return this._run(); }
  onSnapshot(next) { const f = () => next(this._run()); this.s.ls.add(f); setTimeout(f, 0); return () => this.s.ls.delete(f); }
}

const clean = o => JSON.parse(JSON.stringify(o));
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'permission-denied' || c === 'not_granted') return L('এই কাজের অনুমতি নেই', 'You do not have permission for this');
  if (c === 'quota_exceeded' || c === 'resource-exhausted' || c === 'resource_exhausted') return L('জায়গা বা সীমা শেষ — পরে চেষ্টা করুন', 'Storage or limit reached — try later');
  return L('সংরক্ষণ হয়নি — নেটওয়ার্ক দেখে আবার চেষ্টা করুন', 'Not saved — check network and retry');
}

/* ---------- মূল ডেটা স্টোর ---------- */
const DB = {

  unsubAll(arr) { arr.forEach(f => { try { f(); } catch (e) { /* ignore */ } }); arr.length = 0; },
  resetData() { this.data = { profiles: {}, roles: {}, groups: {}, settings: {}, reports: {}, assignments: {} }; this._scopeKey = ''; },

  /* Claude-এর ভেতরে */
  async connectClaude() {
    try {
      const [db, user, assets, dl] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => claude.use(n).catch(() => null)));
      this.dl = dl;

      this.store = db; this.assets = assets; this.me = id; this.mode = 'cloud';
      try { this.owner = !!(await user.isOwner()); } catch (e) { this.owner = false; }

  /* Firebase (নিজের সার্ভার, প্লে স্টোর, অ্যাপ স্টোর) */
  async connectFirebase() {

    catch (e) { toast(L('সার্ভারে সংযোগ হয়নি — ইন্টারনেট দেখুন', 'Could not reach server — check internet')); return false; }

    try { await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) { /* ignore */ }

      let first = true;

        this.unsubAll(this._scoped); this.unsubAll(this._base); this.resetData();
        if (u) { await this.subscribeBase(); this.rescope(); }
        if (first) { first = false; res(); }

      });

  },

  /* ডেমো মোড */
  async useLocal() {
    this.mode = 'local'; this.store = new LocalStore('rj-demo-v3'); this.me = 'demo-dev'; this.owner = true;
    await this.subscribeBase();
    if (!this.data.roles[this.me]) await this.put('roles', this.me, { role: 'dev', approved: true, disabled: false, by: this.me, at: Date.now() });
    this.rescope();
  },

  /* সবার জন্য দরকারি তথ্য */
  subscribeBase() {
    this.unsubAll(this._base);
    const pending = new Set(['profiles', 'roles']); let done; const ready = new Promise(r => { done = r; });
    for (const c of ['profiles', 'roles', 'groups', 'settings']) {
      this._base.push(this.store.collection(c).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
        this.data[c] = m; pending.delete(c); if (!pending.size) done();
        this.rescope(); onData(c);
      }, err => { console.warn(c, err); pending.delete(c); if (!pending.size) done(); }));
    }
    return Promise.race([ready, new Promise(r => setTimeout(r, 9000))]);
  },

  /* ভূমিকা অনুযায়ী শুধু দরকারি রিপোর্ট ও অ্যাসাইনমেন্ট আনা (সার্ভারের নিয়মের সাথে মিল রেখে) */
  rescope() {
    if (!this.me || !this.store) return;
    const role = myRole(), p = me() || {}, lead = ledGroups().length > 0;
    const key = [role, p.zone || '', lead].join('|');
    if (key === this._scopeKey) return;
    this._scopeKey = key;
    this.unsubAll(this._scoped);
    const R = this.store.collection('reports'), A = this.store.collection('assignments');
    const rq = [], aq = [];
    if (role === 'dev' || role === 'senior') { rq.push(R); aq.push(A); }
    else {
      rq.push(R.where('authorId', '==', this.me));
      if (role === 'ao' && p.zone) rq.push(R.where('zone', '==', p.zone).where('status', '==', 'submitted'));
      if (lead || role === 'lead') rq.push(R.where('leaderId', '==', this.me).where('status', '==', 'submitted'));
      aq.push(A.where('assignees', 'array-contains', this.me), A.where('createdBy', '==', this.me));
      if (role === 'ao' && p.zone) aq.push(A.where('zone', '==', p.zone));
    }
    this._listen('reports', rq); this._listen('assignments', aq);
  },
  _listen(col, queries) {
    const parts = queries.map(() => ({}));
    queries.forEach((q, i) => this._scoped.push(q.onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
      parts[i] = m; this.data[col] = Object.assign({}, ...parts); onData(col);
    }, err => console.warn(col, err))));
  },

  async put(col, id, obj) {
    try { const c = clean(obj); await this.store.collection(col).doc(id).set(c); if (this.data[col]) this.data[col][id] = c; return true; }
    catch (e) { console.warn(e); toast(errMsg(e)); return false; }
  },
  async patch(col, id, fields) {

    catch (e) { console.warn(e); toast(errMsg(e)); return false; }
  },
  async del(col, id) {
    try { await this.store.doc(col + '/' + id).delete(); if (this.data[col]) delete this.data[col][id]; return true; }
    catch (e) { console.warn(e); toast(errMsg(e)); return false; }
  },
  watchComments(rid, cb) {

      snap => cb(snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.at - b.at)),
      err => { console.warn(err); cb([]); });
  },
  async addComment(rid, c) {
    try { await this.store.collection('reports/' + rid + '/comments').doc(newId('c')).set(clean(c)); return true; }
    catch (e) { console.warn(e); toast(errMsg(e)); return false; }
  },
  async getContact(uid) { try { const s = await this.store.doc('contacts/' + uid).get(); return s.exists ? s.data() : null; } catch (e) { return null; } },

  /* ছবি ছোট করে সংরক্ষণ — ফেরত দেয় একটি ref */
  async uploadImage(file) {
    if (!file || !/^image\//.test(file.type)) { toast(L('শুধু ছবি দেওয়া যাবে', 'Images only')); return null; }
    if (this.assets) {
      try { const r = await this.assets.upload(await shrink(file, 1600, .82)); return 'a:' + r.id; } catch (e) { /* বিকল্প নিচে */ }
    }
    const small = await shrink(file, this.mode === 'local' ? 720 : 960, .6);
    const dataUrl = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(small); });
    if (!dataUrl) return null;
    if (this.mode === 'local') return dataUrl;
    const pid = newId('p');
    try { await this.store.collection('photos').doc(pid).set({ d: dataUrl, by: this.me, at: Date.now() }); this.photoCache[pid] = dataUrl; return 'p:' + pid; }
    catch (e) { toast(L('ছবি সংরক্ষণ হয়নি', 'Photo not saved')); return null; }
  },
  /* অভিযোগের কপি: ছবি বা PDF */
  async uploadDoc(file) {
    if (!file) return null;
    if (file.size > 15 * 1024 * 1024) { toast(L('ফাইল ১৫ MB-এর বেশি', 'File larger than 15 MB')); return null; }
    if (/^image\//.test(file.type)) { const ref = await this.uploadImage(file); return ref ? { ref, name: clip(file.name, 120), type: 'image' } : null; }
    if (file.type === 'application/pdf' && this.assets) {
      try { const r = await this.assets.upload(file); return { ref: 'a:' + r.id, name: clip(file.name, 120), type: 'pdf' }; } catch (e) { toast(L('ফাইল আপলোড হয়নি', 'Upload failed')); return null; }
    }
    toast(L('এই সংস্করণে শুধু ছবি নেওয়া যায় — PDF-এর পাতার ছবি তুলে দিন', 'Only images in this version — photograph the PDF pages'));
    return null;
  },
  src(ref) {
    if (!ref || typeof ref !== 'string') return '';
    if (ref.startsWith('a:')) return '/_blob/' + encodeURIComponent(ref.slice(2));
    if (ref.startsWith('p:')) return this.photoCache[ref.slice(2)] || '';
    if (ref.startsWith('data:image/')) return ref;
    return '';
  },
  async hydrate() {
    for (const img of $$('img[data-ref^="p:"]')) {
      const id = img.dataset.ref.slice(2);
      if (this.photoCache[id] === undefined && this.store) {

        try { const s = await this.store.doc('photos/' + id).get(); this.photoCache[id] = s.exists ? (s.data().d || '') : ''; } catch (e) { /* ignore */ }
      }
      if (this.photoCache[id] && /^data:image\//.test(this.photoCache[id])) img.src = this.photoCache[id];
    }
  }
};

/* ============================================================
   v-reports.js — রিপোর্ট তালিকা, জরিপ ফর্ম, রিপোর্ট দেখা,
   মন্তব্য/নথি, পুনঃপরিদর্শন (হ্যাঁ/না), প্রতিবেদন ও CSV
   ============================================================ */
'use strict';

const titleOf = r => r.plot ? L('প্লট ', 'Plot ') + r.plot : r.rsDag ? L('আরএস দাগ ', 'RS Dag ') + r.rsDag : r.msDag ? L('এমএস দাগ ', 'MS Dag ') + r.msDag : r.holding ? L('হোল্ডিং ', 'Holding ') + r.holding : (r.address ? clip(plain(r.address), 50) : L('নাম ছাড়া জরিপ', 'Untitled survey'));
const srcPill = r => r.source === 'complaint' ? `<span class="pill p-orange">${L('অভিযোগভিত্তিক', 'Complaint')}</span>` : `<span class="pill p-info">${L('স্বপ্রণোদিত', 'Self')}</span>`;
function scopeText() {
  const role = myRole(), p = me() || {};
  if (role === 'dev' || role === 'senior') return L('সব জোনের রিপোর্ট', 'Reports from all zones');
  if (role === 'ao') return O(ZONES, p.zone) + L('-এর সব রিপোর্ট', ' — all reports');
  return L('আপনার গ্রুপের রিপোর্ট', 'Your group’s reports');
}

/* ---------- তালিকার একটি সারি ---------- */
function reportRow(id, r, showAuthor) {
  const iss = issues(r), od = isOverdue(r);
  const cls = od ? 'red' : r.source === 'complaint' ? 'orange' : 'blue';
  const status = r.status === 'submitted' ? reviewPill(r) : `<span class="pill p-grey">${L('খসড়া', 'Draft')}</span>`;
  const sub = [O(ZONES, r.zone), r.mouza, r.status === 'submitted' ? fdt(r.submittedAt) : fd(r.date)].filter(x => x && x !== '—').join(' | ');
  return `<button class="row ${cls}" data-open="${esc(id)}">
    ${showAuthor ? avatar(r.authorId, 36) : `<span style="width:0"></span>`}
    <span class="main">${showAuthor ? `<div style="font-size:.8rem;font-weight:bold;color:var(--muted)">${esc(nameOf(r.authorId))}</div>` : ''}
      <div class="t1">${esc(titleOf(r))}</div><div class="t2">${esc(sub)}</div>${r.fileNo ? `<div class="t3 num">${esc(r.fileNo)}</div>` : ''}</span>
    <span class="side">${srcPill(r)}${status}
      ${iss.length ? `<span class="pill p-red">${L('বিচ্যুতি', 'Deviation')} ${fmt(iss.length)}</span>` : ''}
      ${od ? `<span class="pill p-red">${fmt(daysSince(r.date || r.submittedAt))} ${L('দিন আগে দেখা', 'days ago')}</span>` : ''}
      ${r.revisit && r.revisit.v === 'yes' ? `<span class="pill p-amber">${L('পুনঃপরিদর্শন দরকার', 'Revisit needed')}</span>` : ''}</span></button>`;
}
function openReport(id) {
  const r = DB.data.reports[id]; if (!r) return;
  V.from = V.name;
  if (r.authorId === DB.me && r.status !== 'submitted') openForm(id); else go('detail', id);
}

/* ---------- রিপোর্ট তালিকা ---------- */
function renderReports() {
  const off = isOfficer();
  if (!off || !V.rtab) V.rtab = off ? 'inbox' : 'mine';
  const tab = V.rtab;
  setCmd('reports', L('রিপোর্ট', 'Reports'), tab === 'mine' ? L('আমার জমা দেওয়া ও খসড়া রিপোর্ট', 'My submitted and draft reports') : scopeText(),
    `<button class="btn pri" id="newRep">${ic('plus', 16)} ${L('নতুন জরিপ', 'New survey')}</button><button class="btn" id="csvRep">${ic('download', 16)} CSV</button>`);
  let list = Object.entries(DB.data.reports).filter(([, r]) => tab === 'mine' ? r.authorId === DB.me : (r.authorId !== DB.me && canSee(r)));
  if (V.rsrc && V.rsrc !== 'all') list = list.filter(([, r]) => (r.source || 'self') === V.rsrc);
  const st = V.rst || 'all';
  if (st === 'overdue') list = list.filter(([, r]) => isOverdue(r));
  else if (st === 'revisit') list = list.filter(([, r]) => r.revisit && r.revisit.v === 'yes');
  else if (st === 'draft') list = list.filter(([, r]) => r.status !== 'submitted');
  else if (st !== 'all') list = list.filter(([, r]) => r.status === 'submitted' && (reviewState(r) === st || (st === 'new' && reviewState(r) === 'resub') || (st === 'review' && reviewState(r) === 'comment')));
  const q = (V.q || '').trim().toLowerCase();
  if (q) list = list.filter(([, r]) => [r.plot, r.rsDag, r.msDag, r.holding, r.owner, r.mouza, r.planNo, r.letterNo, r.fileNo, r.complaintNo, plain(r.address), nameOf(r.authorId)].join(' ').toLowerCase().includes(q));
  list.sort((a, b) => (b[1].submittedAt || b[1].updatedAt || 0) - (a[1].submittedAt || a[1].updatedAt || 0));
  V.lastList = list;
  const stChips = tab === 'mine'
    ? [['all', L('সব', 'All')], ['draft', L('খসড়া', 'Drafts')], ['returned', L('ফেরত', 'Returned')], ['overdue', L('১ মাস পার', 'Over a month')]]
    : [['all', L('সব', 'All')], ['new', L('নতুন', 'New')], ['review', L('পর্যালোচনাধীন', 'In review')], ['nothi', L('নথি পেশ', 'Filed')], ['returned', L('ফেরত', 'Returned')], ['closed', L('নিষ্পত্তি', 'Closed')], ['overdue', L('১ মাস পার', 'Over a month')], ['revisit', L('পুনঃপরিদর্শন', 'Revisit')]];
  $('#content').innerHTML = `
    ${off ? `<div class="seg" role="group"><button data-rtab="inbox" aria-pressed="${tab === 'inbox'}">${L('প্রাপ্ত রিপোর্ট', 'Received')}</button><button data-rtab="mine" aria-pressed="${tab === 'mine'}">${L('আমার রিপোর্ট', 'My reports')}</button></div>` : ''}
    <div class="toolbar"><input type="search" id="q" value="${esc(V.q || '')}" placeholder="${L('প্লট, দাগ, মালিক, ফাইল বা অভিযোগ নম্বর', 'Plot, dag, owner, file or complaint no.')}" aria-label="${L('খুঁজুন', 'Search')}">
      <select id="srcF" style="width:auto">${opts([{ v: 'all', b: 'সব ধরন', e: 'All types' }, ...SOURCES], V.rsrc || 'all', false)}</select></div>
    <div class="chips">${stChips.map(([k, n]) => `<button class="chip" data-st="${k}" aria-pressed="${st === k}">${n}</button>`).join('')}</div>
    <p class="hint">${L(`${fmt(list.length)}টি রিপোর্ট`, `${list.length} reports`)}</p>
    <div class="list">${list.map(([id, r]) => reportRow(id, r, tab !== 'mine')).join('') || `<div class="empty"><b>${L('কোনো রিপোর্ট নেই', 'No reports')}</b><p>${tab === 'mine' ? L('নতুন জরিপ করে জমা দিলে এখানে দেখাবে।', 'Submit a survey and it shows here.') : L('পরিদর্শকরা জমা দিলে এখানে আসবে।', 'Reports appear here once submitted.')}</p></div>`}</div>`;
  $('#newRep').onclick = () => newReport(null);
  $('#csvRep').onclick = () => exportReportsCsv(V.lastList);
  $$('[data-rtab]').forEach(b => b.onclick = () => { V.rtab = b.dataset.rtab; V.rst = 'all'; render(); });
  $$('[data-st]').forEach(b => b.onclick = () => { V.rst = b.dataset.st; render(); });
  $('#srcF').onchange = e => { V.rsrc = e.target.value; render(); };
  const qi = $('#q'); qi.oninput = () => { V.q = qi.value; const p = qi.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $$('[data-open]').forEach(b => b.onclick = () => openReport(b.dataset.open));
}

/* ---------- নতুন জরিপ ---------- */
function newReport(a) {
  const p = me() || {};
  if (a) {
    const ex = Object.entries(DB.data.reports).find(([, r]) => r.assignmentId === a.id && r.authorId === DB.me);
    if (ex) { openReport(ex[0]); return; }
  }
  const r = { id: newId('r'), authorId: DB.me, status: 'draft', createdAt: Date.now(), updatedAt: Date.now(), date: today(), unit: 'm',
    zone: p.zone || '', shape: 'rect', roads: { front: { on: true } }, photos: [], floorsList: [], source: 'self' };
  if (a) Object.assign(r, { source: 'complaint', assignmentId: a.id, complaintNo: a.complaintNo || '', zone: a.zone || r.zone, mouza: a.area || '', address: a.address || '', gps: a.gps || '' });
  V.rec = r; V.dirty = false; V.isNew = true; V.from = V.name;
  if (a && a.status === 'open' && (a.assignees || []).includes(DB.me)) DB.patch('assignments', a.id, { status: 'inprogress' });
  go('form');
}
function openForm(id) {
  const r = JSON.parse(JSON.stringify(DB.data.reports[id]));
  r.roads = r.roads || {}; r.photos = r.photos || []; r.floorsList = r.floorsList || []; r.source = r.source || 'self';
  V.rec = r; V.dirty = false; V.isNew = false;
  go('form');
}

  const r = V.rec, v = r[k] ?? '', id = 'f_' + k;
  let inp;
  if (o.list) inp = `<select id="${id}" data-k="${k}">${opts(o.list, v)}</select>`;
  else inp = `<input id="${id}" data-k="${k}" type="${o.type || 'text'}" ${o.type === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} maxlength="${o.max || 120}" value="${esc(v)}" placeholder="${esc(o.ph || '')}">`;
  return `<div class="f${o.full ? ' full' : ''}"><label class="l" for="${id}">${label}${o.req ? ' <span class="req">*</span>' : ''}</label>${inp}</div>`;
}

function liveForm(k) {
  const c = CMP().find(x => k === x.k + 'A' || k === x.k + 'M');
  if (c) { const d = compare(c, V.rec), o = $('#res_' + c.k); if (o) { o.className = 'res ' + d.s; o.textContent = d.t; } }
  if (['plot', 'rsDag', 'msDag', 'holding', 'address'].includes(k)) { const h = $('#cmd h1'); if (h) h.textContent = titleOf(V.rec); }
  if (k === 'unit') { const y = window.scrollY; renderForm(); window.scrollTo(0, y); return; }
  if (k === 'gps') { V.rec.gpsAcc = null; $('#gpsMsg').innerHTML = gpsInfo(V.rec); }

}

async function getGps(auto) {

  if (ok) { V.dirty = false; V.isNew = false; if (showToast) toast(L('খসড়া সংরক্ষিত', 'Draft saved')); }
  return ok;
}

  const re = r.status === 'submitted';
  r.status = 'submitted';
  r.fileNo = r.fileNo || genNo(r.source === 'complaint' ? 'CMP' : 'SLF', r.zone);
  r.submittedAt = r.submittedAt || Date.now(); if (re) r.resubmittedAt = Date.now();
  const gid = (me() || {}).groupId, g = gid ? DB.data.groups[gid] : null;

async function sendComment(r) {
  const kind = ($('#cKind') || {}).value || 'comment', text = clip($('#cTxt').value.trim(), 5000), f = $('#cFile');
  if (!text && kind === 'comment') { toast(L('মন্তব্য লিখুন', 'Write a comment')); return; }
  const btn = $('#cSend'); btn.disabled = true;
  const c = { by: DB.me, kind, text, at: Date.now() };
  if (kind === 'nothi') c.nothiNo = genNo('NTH', r.zone);
  if (f && f.files[0]) { const up = await DB.uploadDoc(f.files[0]); if (up) c.file = up; }
  let ok = await DB.addComment(r.id, c);
  if (ok && r.authorId !== DB.me && isOfficer()) {
    const prev = r.review || {};
    const s = kind === 'comment' ? (prev.s || 'review') : kind;
    ok = await DB.patch('reports', r.id, { review: { s, at: Date.now(), by: DB.me, nothiNo: c.nothiNo || prev.nothiNo || '' } });
  }
  btn.disabled = false;
  if (ok) { toast(kind === 'nothi' ? L('নথি পেশ হয়েছে — ', 'Filed — ') + c.nothiNo : L('পাঠানো হয়েছে', 'Sent')); $('#cTxt').value = ''; const p = $('#cTxt_prev'); if (p) p.innerHTML = ''; if (f) { f.value = ''; $('#cFileName').textContent = ''; } render(); }
}

function reportText(r) {
  const u = unitsOf(r), X = [];
  X.push(L('রাজউক সরজমিন পরিদর্শন প্রতিবেদন', 'RAJUK Field Inspection Report'));
  X.push(L('ফাইল নং: ', 'File no.: ') + (r.fileNo || '—') + ' | ' + O(SOURCES, r.source || 'self'));
  if (r.complaintNo) X.push(L('অভিযোগ নং: ', 'Complaint no.: ') + r.complaintNo);
  if (r.review && r.review.nothiNo) X.push(L('নথি নং: ', 'Nothi no.: ') + r.review.nothiNo);
  X.push(L('পরিদর্শক: ', 'Inspector: ') + nameOf(r.authorId) + ' (' + desigOf(r.authorId) + ')');
  X.push(L('পরিদর্শনের তারিখ: ', 'Inspection date: ') + fd(r.date) + ' | ' + L('জমা: ', 'Submitted: ') + fdt(r.submittedAt));
  X.push('');
  X.push(`${L('জোন', 'Zone')}: ${O(ZONES, r.zone)}${r.subZone ? ' (' + r.subZone + ')' : ''} | ${L('মৌজা', 'Mouza')}: ${r.mouza || '—'}`);
  X.push(`${L('আরএস দাগ', 'RS Dag')}: ${r.rsDag || '—'} | ${L('এমএস দাগ', 'MS Dag')}: ${r.msDag || '—'} | ${L('প্লট', 'Plot')}: ${r.plot || '—'} | ${L('হোল্ডিং', 'Holding')}: ${r.holding || '—'}`);
  X.push(`${L('মালিক', 'Owner')}: ${r.owner || '—'}`); if (r.address) X.push(`${L('ঠিকানা', 'Address')}: ${r.address}`);
  X.push(`GPS: ${r.gps || '—'}`);
  X.push(`${L('নকশা নং', 'Plan no.')}: ${r.planNo || '—'} | ${L('চিঠি/ইস্যু নং', 'Letter no.')}: ${r.letterNo || '—'} | ${L('তারিখ', 'Date')}: ${r.approvalDate ? fd(r.approvalDate) : '—'}`);
  if (r.btypeA || r.btypeM) X.push(`${L('ভবনের শ্রেণি', 'Building type')}: ${L('অনুমোদিত', 'approved')} ${r.btypeA || '—'} | ${L('সরজমিন', 'on site')} ${r.btypeM || '—'}`);
  X.push(`${L('জমির আকৃতি', 'Plot shape')}: ${O(SHAPES, r.shape)}${r.plotArea ? ' | ' + L('আয়তন', 'Area') + ': ' + fmt(num(r.plotArea)) + ' ' + u.area : ''}`);
  X.push('');
  X.push(L('মাপ (অনুমোদিত / সরজমিন):', 'Measurements (approved / on site):'));
  SIDES.forEach(s => { const x = (r.roads || {})[s.v]; if (!x || !x.on) return; const d = roadCmp(s.v, r); X.push(`- ${L('রাস্তা', 'Road')} (${L(s.b, s.e)}): ${fmt(num(x.a))} / ${fmt(num(x.m))} ${u.len}${d.s !== 'none' ? ' → ' + d.t : ''}`); });
  CMP().forEach(c => { const [a, m] = cmpVals(c, r); if (a == null && m == null) return; const d = compare(c, r); X.push(`- ${c.n}: ${fmt(a)} / ${fmt(m)} ${unitOf(c, r)}${d.s !== 'none' ? ' → ' + d.t : ''}`); });
  if ((r.floorsList || []).length) {
    X.push(''); X.push(L('তলাভিত্তিক ফ্লোর এরিয়া (অনুমোদিত / সরজমিন):', 'Floor-wise area (approved / on site):'));
    r.floorsList.forEach(f => { const d = floorCmp(f, r); X.push(`- ${f.name || ''}: ${fmt(num(f.a))} / ${fmt(num(f.m))} ${u.area}${d.s !== 'none' ? ' → ' + d.t : ''}`); });
    const s = floorSum(r); X.push(`${L('যোগফল', 'Total')}: ${fmt(s.a)} / ${fmt(s.m)} ${u.area}`);
  }
  if (r.floorNote) X.push(L('তলার বিবরণ: ', 'Floor notes: ') + plain(r.floorNote));
  X.push('');
  const iss = issues(r);
  X.push(iss.length ? L(`বিচ্যুতি (${fmt(iss.length)}টি):`, `Deviations (${iss.length}):`) : L('বিচ্যুতি: দেওয়া মাপ অনুযায়ী নেই', 'Deviations: none in entered measurements'));
  iss.forEach((t, i) => X.push(`${fmt(i + 1)}. ${t}`));
  X.push('');
  if (r.cstat) X.push(L('বর্তমান অবস্থা: ', 'Current status: ') + O(CSTAT, r.cstat));
  if (r.reco) X.push(L('সুপারিশ: ', 'Recommendation: ') + O(RECO, r.reco));
  if (r.remarks) X.push(L('মন্তব্য: ', 'Remarks: ') + plain(r.remarks));
  if ((r.photos || []).length) X.push(L('ছবি: ', 'Photos: ') + fmt(r.photos.length));
  X.push(''); X.push(`— ${APP.nameEn} | ${APP.company}`);
  return X.join('\n');
}

function exportReportsCsv(list) {
  const cols = [['fileNo', L('ফাইল নং', 'File no.')], ['_src', L('ধরন', 'Type')], ['complaintNo', L('অভিযোগ নং', 'Complaint no.')], ['_insp', L('পরিদর্শক', 'Inspector')], ['_sub', L('জমার সময়', 'Submitted')], ['_rev', L('অবস্থা', 'Status')], ['_nothi', L('নথি নং', 'Nothi no.')],
    ['date', L('পরিদর্শনের তারিখ', 'Inspection date')], ['_zone', L('জোন', 'Zone')], ['subZone', L('সাব-জোন', 'Sub-zone')], ['mouza', L('মৌজা', 'Mouza')], ['rsDag', L('আরএস দাগ', 'RS Dag')], ['msDag', L('এমএস দাগ', 'MS Dag')],
    ['plot', L('প্লট', 'Plot')], ['holding', L('হোল্ডিং', 'Holding')], ['owner', L('মালিক', 'Owner')], ['address', L('ঠিকানা', 'Address')], ['gps', 'GPS'], ['planNo', L('নকশা নং', 'Plan no.')], ['letterNo', L('চিঠি/ইস্যু নং', 'Letter no.')],
    ['approvalDate', L('অনুমোদনের তারিখ', 'Approval date')], ['btypeA', L('অনুমোদিত শ্রেণি', 'Approved type')], ['btypeM', L('সরজমিন শ্রেণি', 'Type on site')], ['unit', L('একক', 'Unit')], ['_shape', L('আকৃতি', 'Shape')], ['plotArea', L('প্লটের আয়তন', 'Plot area')]];
  SIDES.forEach(s => { cols.push(['_ra_' + s.v, L('রাস্তা নকশা ', 'Road plan ') + L(s.b, s.e)]); cols.push(['_rm_' + s.v, L('রাস্তা সরজমিন ', 'Road site ') + L(s.b, s.e)]); });
  CMP().forEach(c => { cols.push(['_a_' + c.k, c.n + ' (' + L('অনুমোদিত', 'approved') + ')']); cols.push(['_m_' + c.k, c.n + ' (' + L('সরজমিন', 'on site') + ')']); });
  cols.push(['_floors', L('তলাভিত্তিক এরিয়া', 'Floor areas')], ['_cstat', L('বর্তমান অবস্থা', 'Current status')], ['_reco', L('সুপারিশ', 'Recommendation')], ['_remarks', L('মন্তব্য', 'Remarks')], ['_revisit', L('পুনঃপরিদর্শন', 'Revisit')]);
  const rows = [cols.map(c => c[1]).concat(L('বিচ্যুতির সংখ্যা', 'Deviation count'), L('বিচ্যুতি', 'Deviations'))];
  (list || []).forEach(([, r]) => {
    const x = Object.assign({}, r, { _src: O(SOURCES, r.source || 'self'), _insp: nameOf(r.authorId), _sub: r.submittedAt ? fdt(r.submittedAt) : '', _rev: r.status === 'submitted' ? (REVIEW[reviewState(r)] || REVIEW.new)()[1] : L('খসড়া', 'Draft'),
      _nothi: (r.review && r.review.nothiNo) || '', _zone: O(ZONES, r.zone), _shape: O(SHAPES, r.shape), _cstat: r.cstat ? O(CSTAT, r.cstat) : '', _reco: r.reco ? O(RECO, r.reco) : '', _remarks: plain(r.remarks),
      _floors: (r.floorsList || []).map(f => `${f.name}: ${f.a || '-'}/${f.m || '-'}`).join('; '), _revisit: r.revisit ? (r.revisit.v === 'yes' ? L('হ্যাঁ', 'Yes') : L('না', 'No')) : '' });
    SIDES.forEach(s => { const rd = (r.roads || {})[s.v] || {}; x['_ra_' + s.v] = rd.on ? rd.a : ''; x['_rm_' + s.v] = rd.on ? rd.m : ''; });
    CMP().forEach(c => { const [a, m] = cmpVals(c, r); x['_a_' + c.k] = a ?? ''; x['_m_' + c.k] = m ?? ''; });
    const iss = issues(r); rows.push(cols.map(c => x[c[0]]).concat(iss.length, iss.join('; ')));
  });
  saveFile(`rajuk-reports-${today()}.csv`, toCsv(rows), 'text/csv');
}

/* ============================================================
   v-assign.js — অ্যাসাইনমেন্ট (অভিযোগের ভিত্তিতে সাইট পরিদর্শনের নির্দেশ)
   উচ্চ পর্যায় / অথরাইজড অফিসার / গ্রুপ প্রধান অ্যাসাইনমেন্ট দেন,
   পরিদর্শক সরজমিনে গিয়ে সেখান থেকেই জরিপ শুরু করেন।
   ============================================================ */
'use strict';

const aStatusPill = a => {
  if (isAOverdue(a)) return `<span class="pill p-red">${L('মেয়াদ পেরিয়েছে', 'Overdue')}</span>`;
  const c = { open: 'p-info', inprogress: 'p-amber', done: 'p-ok', cancelled: 'p-grey' }[a.status] || 'p-info';
  return `<span class="pill ${c}">${esc(O(ASTATUS, a.status))}</span>`;
};
const myOpenAssignments = () => Object.entries(DB.data.assignments).filter(([, a]) => (a.assignees || []).includes(DB.me) && ['open', 'inprogress'].includes(a.status));

function assignRow(id, a) {
  const cls = isAOverdue(a) ? 'red' : a.status === 'done' ? 'ok' : a.status === 'cancelled' ? '' : 'orange';
  const who = (a.assignees || []).slice(0, 3).map(u => avatar(u, 24)).join('');
  return `<button class="row ${cls}" data-aopen="${esc(id)}">
    <span style="display:flex">${who || avatar(a.createdBy, 30)}</span>
    <span class="main"><div class="t1">${esc(a.area || L('এলাকা উল্লেখ নেই', 'No area'))}</div>
      <div class="t2">${esc([O(ZONES, a.zone), a.complaintNo ? L('অভিযোগ ', 'Complaint ') + a.complaintNo : '', a.dueDate ? L('শেষ তারিখ ', 'Due ') + fd(a.dueDate) : ''].filter(x => x && x !== '—').join(' | '))}</div>
      <div class="t3">${L('দিয়েছেন: ', 'By: ')}${esc(nameOf(a.createdBy))} | ${fdt(a.createdAt)}</div></span>
    <span class="side">${aStatusPill(a)}${a.priority === 'urgent' ? `<span class="pill p-red">${L('জরুরি', 'Urgent')}</span>` : ''}</span></button>`;
}

function renderAssign() {
  const tabs = [['mine', L('আমার জন্য', 'Assigned to me')]];
  if (canAssign()) tabs.push(['given', L('আমি দিয়েছি', 'Given by me')]);
  if (isSeniorUp() || myRole() === 'ao') tabs.push(['all', isSeniorUp() ? L('সব', 'All') : L('জোনের সব', 'Zone')]);
  if (!tabs.some(t => t[0] === V.atab)) V.atab = canAssign() ? 'given' : 'mine';
  setCmd('assign', L('অ্যাসাইনমেন্ট', 'Assignments'), L('অভিযোগের ভিত্তিতে সাইট পরিদর্শন', 'Complaint-based site visits'),
    canAssign() ? `<button class="btn pri" id="newA">${ic('plus', 16)} ${L('নতুন অ্যাসাইনমেন্ট', 'New assignment')}</button>` : '');
  let list = Object.entries(DB.data.assignments).filter(([, a]) => canSeeA(a));
  if (V.atab === 'mine') list = list.filter(([, a]) => (a.assignees || []).includes(DB.me));
  if (V.atab === 'given') list = list.filter(([, a]) => a.createdBy === DB.me);
  const st = V.ast || 'active';
  if (st === 'active') list = list.filter(([, a]) => ['open', 'inprogress'].includes(a.status));
  else if (st === 'overdue') list = list.filter(([, a]) => isAOverdue(a));
  else if (st !== 'all') list = list.filter(([, a]) => a.status === st);
  const q = (V.aq || '').trim().toLowerCase();
  if (q) list = list.filter(([, a]) => [a.area, a.address, a.complaintNo, a.no, plain(a.details), nameOf(a.createdBy)].join(' ').toLowerCase().includes(q));
  list.sort((x, y) => (y[1].createdAt || 0) - (x[1].createdAt || 0));
  $('#content').innerHTML = `
    <div class="seg" role="group">${tabs.map(([k, n]) => `<button data-atab="${k}" aria-pressed="${V.atab === k}">${n}</button>`).join('')}</div>
    <div class="toolbar"><input type="search" id="aq" value="${esc(V.aq || '')}" placeholder="${L('এলাকা, ঠিকানা বা অভিযোগ নম্বর', 'Area, address or complaint no.')}" aria-label="${L('খুঁজুন', 'Search')}"></div>
    <div class="chips">${[['active', L('চলমান', 'Active')], ['open', L('নতুন', 'New')], ['inprogress', L('চলছে', 'In progress')], ['overdue', L('মেয়াদ পেরিয়েছে', 'Overdue')], ['done', L('সম্পন্ন', 'Done')], ['cancelled', L('বাতিল', 'Cancelled')], ['all', L('সব', 'All')]]
      .map(([k, n]) => `<button class="chip" data-ast="${k}" aria-pressed="${st === k}">${n}</button>`).join('')}</div>
    <div class="list">${list.map(([id, a]) => assignRow(id, a)).join('') || `<div class="empty"><b>${L('কোনো অ্যাসাইনমেন্ট নেই', 'No assignments')}</b><p>${canAssign() ? L('অভিযোগ এলে নতুন অ্যাসাইনমেন্ট দিয়ে পরিদর্শককে পাঠান।', 'Create one to send an inspector to a site.') : L('অফিসার কাজ দিলে এখানে দেখাবে।', 'Tasks from officers appear here.')}</p></div>`}</div>`;
  const n = $('#newA'); if (n) n.onclick = () => newAssignment(null);
  $$('[data-atab]').forEach(b => b.onclick = () => { V.atab = b.dataset.atab; render(); });
  $$('[data-ast]').forEach(b => b.onclick = () => { V.ast = b.dataset.ast; render(); });
  const qi = $('#aq'); qi.oninput = () => { V.aq = qi.value; const p = qi.selectionStart; render(); const x = $('#aq'); x.focus(); x.setSelectionRange(p, p); };
  $$('[data-aopen]').forEach(b => b.onclick = () => { V.from = 'assign'; go('assignDetail', b.dataset.aopen); });
}

/* ---------- নতুন অ্যাসাইনমেন্ট ---------- */
function newAssignment(pre) {
  if (!canAssign()) { toast(L('অ্যাসাইনমেন্ট দেওয়ার অনুমতি নেই', 'Not allowed to assign')); return; }
  const p = me() || {};
  V.arec = Object.assign({ id: newId('a'), zone: p.zone || '', area: '', address: '', gps: '', complaintNo: '', complaintDate: '', details: '', files: [], assignees: [], dueDate: '', priority: 'normal' }, pre || {});
  V.pickZone = V.arec.zone || 'all'; V.pickQ = '';
  V.from = V.name; go('assignForm');
}
function pickerHTML() {
  const a = V.arec, q = (V.pickQ || '').toLowerCase();
  const people = Object.entries(DB.data.profiles).filter(([uid, p]) => !(DB.data.roles[uid] || {}).disabled && (V.pickZone === 'all' || p.zone === V.pickZone) && (!q || (p.name || '').toLowerCase().includes(q)))
    .sort((x, y) => (x[1].name || '').localeCompare(y[1].name || ''));
  return people.length ? people.map(([uid, p]) => `<label class="pick"><input type="checkbox" data-pick="${esc(uid)}" ${a.assignees.includes(uid) ? 'checked' : ''}>${avatar(uid, 30)}
    <span><span class="nm">${esc(p.name || '')}${uid === DB.me ? L(' (আপনি)', ' (you)') : ''}</span><br><span class="ds">${esc(desigOf(uid))} | ${esc(O(ZONES, p.zone))}</span></span></label>`).join('')
    : `<p class="hint" style="padding:10px;margin:0">${L('এই জোনে কেউ নেই', 'Nobody in this zone')}</p>`;
}

  setCmd('assign', L('নতুন অ্যাসাইনমেন্ট', 'New assignment'), L('পরিদর্শককে সাইট দেখে আসার নির্দেশ', 'Send an inspector to a site'),

  $('#content').innerHTML = `<div class="cols c21"><div>

        ${f('zone', L('জোন', 'Zone'), { list: ZONES, req: true })}
        ${f('area', L('এলাকার নাম', 'Area name'), { req: true, ph: L('যেমন: মিরপুর ১০, রোড ৫', 'e.g. Mirpur 10, Road 5') })}
        <div class="f full"><label class="l" for="a_address">${L('ঠিকানা / সাইটের বিবরণ', 'Address / site')}</label><textarea id="a_address" data-ak="address" rows="2" maxlength="400">${esc(a.address)}</textarea></div>
        ${f('gps', L('GPS (জানা থাকলে)', 'GPS (if known)'), { ph: '23.8041, 90.3667' })}
        ${f('priority', L('গুরুত্ব', 'Priority'), { list: PRIORITY, nonone: true })}
        ${f('dueDate', L('শেষ তারিখ', 'Due date'), { type: 'date' })}
        <div class="f full"><label class="l" for="a_details">${L('নির্দেশনা / অভিযোগের সারাংশ', 'Instructions / complaint summary')}</label>${rte('a_details', '', a.details, L('কী দেখে আসতে হবে — জরুরি অংশ বোল্ড বা হাইলাইট করুন', 'What to check — bold or highlight key points'), 4)}</div>

    <section class="card"><h3>${L('অভিযোগের কপি', 'Complaint copy')}</h3><p class="hint">${L('অভিযোগপত্রের ছবি বা PDF যুক্ত করুন।', 'Attach a photo or PDF of the complaint.')}</p>
      <span class="btn filebtn">${ic('camera', 16)} ${L('ফাইল যুক্ত করুন', 'Attach file')}<input type="file" id="aFiles" accept="image/*,application/pdf" multiple></span><span class="gpsmsg" id="aMsg"></span>
      <div id="aFilesBox">${filesHTML(a.files, true)}</div></section></div>

      <div class="grid" style="margin-bottom:8px"><div class="f"><label class="l" for="pickZone">${L('জোন', 'Zone')}</label><select id="pickZone">${opts([{ v: 'all', b: 'সব জোন', e: 'All zones' }, ...ZONES], V.pickZone, false)}</select></div>

    $('#aMsg').textContent = ' ' + L('আপলোড হচ্ছে…', 'Uploading…');

    $('#aMsg').textContent = ''; e.target.value = ''; $('#aFilesBox').innerHTML = filesHTML(V.arec.files, true); bindFiles(); DB.hydrate();
  };
  $('#aSave').onclick = saveAssignment;
}
async function saveAssignment() {
  const a = V.arec;
  if (!a.zone) { toast(L('জোন বাছাই করুন', 'Choose a zone')); $('#a_zone').focus(); return; }
  if (!a.area.trim()) { toast(L('এলাকার নাম দিন', 'Enter the area name')); $('#a_area').focus(); return; }
  if (!a.assignees.length) { toast(L('অন্তত একজনকে বাছাই করুন', 'Pick at least one person')); return; }
  if (a.gps && !parseGps(a.gps)) { toast(L('GPS সঠিক নয়', 'Invalid GPS')); return; }
  const doc = Object.assign({}, a, { details: clip(a.details, 5000), no: genNo('ASG', a.zone), createdBy: DB.me, createdAt: Date.now(), status: 'open' });
  delete doc.id;
  const sb = $('#aSave'); sb.disabled = true;
  const ok = await DB.put('assignments', a.id, doc);
  sb.disabled = false;
  if (ok) { toast(L('অ্যাসাইনমেন্ট দেওয়া হয়েছে', 'Assignment sent')); const id = a.id; V.arec = null; V.from = 'assign'; go('assignDetail', id); }
}

/* ---------- অ্যাসাইনমেন্ট দেখা ---------- */

  if (!a || !canSeeA(a)) { go('assign'); return; }
  const mineA = (a.assignees || []).includes(DB.me), creator = a.createdBy === DB.me || isDev();
  const active = ['open', 'inprogress'].includes(a.status);
  const rep = a.reportId ? DB.data.reports[a.reportId] : null;
  setCmd('assign', a.area || L('অ্যাসাইনমেন্ট', 'Assignment'), a.no || '',

     ${creator ? `<button class="btn danger" id="aDel">${L('মুছুন', 'Delete')}</button>` : ''}`, true);
  const g = parseGps(a.gps), kv = (k, v) => v && v !== '—' ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  $('#content').innerHTML = `
    ${isAOverdue(a) ? `<div class="banner bad">${L('শেষ তারিখ পেরিয়ে গেছে', 'The due date has passed')} (${fd(a.dueDate)})</div>` : ''}
    <div class="cols c21"><div>

/* ---------- পরিসংখ্যান ---------- */
function periodList(gran) {
  const out = [], d = new Date();
  if (gran === 'day') for (let i = 13; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i); out.push({ key: dayKey(x), label: x.toLocaleDateString(loc(), { day: 'numeric', month: 'short' }) }); }
  if (gran === 'month') for (let i = 11; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push({ key: monthKey(x), label: x.toLocaleDateString(loc(), { month: 'short', year: '2-digit' }) }); }
  if (gran === 'year') for (let i = 4; i >= 0; i--) { const y = d.getFullYear() - i; out.push({ key: String(y), label: fmt(y).replace(/[,٬]/g, '') }); }
  return out;
}
const keyFn = g => (g === 'day' ? dayKey : g === 'month' ? monthKey : yearKey);

function barChart(rows) {
  const W = 640, H = 230, pl = 34, pb = 44, pt = 10, n = rows.length, max = Math.max(1, ...rows.map(r => r.c + r.s));
  const bw = (W - pl - 10) / n, h = H - pb - pt, y = v => pt + h - (v / max) * h;
  const ticks = [...new Set([0, Math.ceil(max / 2), max])];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('রিপোর্টের সংখ্যা', 'Report count')}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line2)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(t)}</text>`).join('')}
    ${rows.map((r, i) => { const x = pl + i * bw + bw * .18, w = bw * .64;
      return `<rect x="${x.toFixed(1)}" y="${y(r.s).toFixed(1)}" width="${w.toFixed(1)}" height="${(h - (y(r.s) - pt)).toFixed(1)}" fill="var(--blue)" rx="1"><title>${esc(r.label)}: ${fmt(r.s)}</title></rect>
      <rect x="${x.toFixed(1)}" y="${y(r.s + r.c).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(r.s) - y(r.s + r.c)).toFixed(1)}" fill="var(--orange)" rx="1"><title>${esc(r.label)}: ${fmt(r.c)}</title></rect>
      ${r.c + r.s ? `<text x="${(x + w / 2).toFixed(1)}" y="${(y(r.s + r.c) - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ink)">${fmt(r.c + r.s)}</text>` : ''}
      <text x="${(x + w / 2).toFixed(1)}" y="${H - pb + 16}" text-anchor="middle" font-size="9.5" fill="var(--muted)" transform="rotate(-35 ${(x + w / 2).toFixed(1)} ${H - pb + 16})">${esc(r.label)}</text>`; }).join('')}
  </svg>`;
}

function renderStats() {
  const gran = V.sgran || 'day', zoneF = V.szone || 'all';
  setCmd('stats', L('পরিসংখ্যান', 'Statistics'), L('দিন, মাস ও বছর অনুযায়ী ফাইলের হিসাব', 'File counts by day, month and year'), `<button class="btn" id="stCsv">${ic('download', 16)} CSV</button>`);
  let sub = visibleSubmitted();
  if (zoneF !== 'all') sub = sub.filter(([, r]) => r.zone === zoneF);
  const kf = keyFn(gran), t = Date.now();
  const split = f => { const x = sub.filter(([, r]) => f(r)); return { all: x.length, c: x.filter(([, r]) => r.source === 'complaint').length, s: x.filter(([, r]) => r.source !== 'complaint').length }; };
  const kToday = split(r => dayKey(r.submittedAt) === dayKey(t)), kMonth = split(r => monthKey(r.submittedAt) === monthKey(t)), kYear = split(r => yearKey(r.submittedAt) === yearKey(t)), kAll = split(() => true);
  const rows = periodList(gran).map(p => {
    const x = sub.filter(([, r]) => kf(r.submittedAt) === p.key);
    return { label: p.label, key: p.key, c: x.filter(([, r]) => r.source === 'complaint').length, s: x.filter(([, r]) => r.source !== 'complaint').length, dev: x.filter(([, r]) => issues(r).length).length, nothi: x.filter(([, r]) => r.review && r.review.nothiNo).length };
  });
  V.statRows = rows;
  const as = Object.values(DB.data.assignments).filter(canSeeA).filter(a => zoneF === 'all' || a.zone === zoneF);
  const kpi = (k, o, c) => `<div class="kpi" style="--kc:var(${c})"><div class="v num">${fmt(o.all)}</div><div class="k">${k}</div><div class="s">${L('অভিযোগ ', 'Complaint ')}${fmt(o.c)} | ${L('স্বপ্রণোদিত ', 'Self ')}${fmt(o.s)}</div></div>`;
  const tot = rows.reduce((a, r) => ({ c: a.c + r.c, s: a.s + r.s, dev: a.dev + r.dev, nothi: a.nothi + r.nothi }), { c: 0, s: 0, dev: 0, nothi: 0 });
  $('#content').innerHTML = `
    <div class="toolbar"><div class="seg" role="group" style="margin:0">${[['day', L('দিন', 'Day')], ['month', L('মাস', 'Month')], ['year', L('বছর', 'Year')]].map(([k, n]) => `<button data-gran="${k}" aria-pressed="${gran === k}">${n}</button>`).join('')}</div>
      <select id="stZone" style="width:auto">${opts([{ v: 'all', b: 'সব জোন', e: 'All zones' }, ...ZONES], zoneF, false)}</select></div>
    <div class="kpis">${kpi(L('আজ', 'Today'), kToday, '--blue')}${kpi(L('এই মাসে', 'This month'), kMonth, '--green')}${kpi(L('এই বছরে', 'This year'), kYear, '--teal')}${kpi(L('মোট', 'Total'), kAll, '--purple')}</div>
    <section class="card"><h3>${gran === 'day' ? L('গত ১৪ দিন', 'Last 14 days') : gran === 'month' ? L('গত ১২ মাস', 'Last 12 months') : L('গত ৫ বছর', 'Last 5 years')}</h3>
      <div class="chart">${barChart(rows)}</div>
      <div class="legend"><span><i style="background:var(--orange)"></i>${L('অভিযোগভিত্তিক', 'Complaint-based')}</span><span><i style="background:var(--blue)"></i>${L('স্বপ্রণোদিত', 'Self-initiated')}</span></div></section>
    <div class="cols c21">
    <section class="card"><h3>${L('হিসাবের তালিকা', 'Count table')}</h3><div class="tscroll"><table class="tbl"><thead><tr>
      <th>${gran === 'day' ? L('দিন', 'Day') : gran === 'month' ? L('মাস', 'Month') : L('বছর', 'Year')}</th><th class="r">${L('অভিযোগভিত্তিক', 'Complaint')}</th><th class="r">${L('স্বপ্রণোদিত', 'Self')}</th><th class="r">${L('মোট', 'Total')}</th><th class="r">${L('বিচ্যুতিসহ', 'With deviation')}</th><th class="r">${L('নথি পেশ', 'Filed')}</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r => `<tr><td>${esc(r.label)}</td><td class="r num">${fmt(r.c)}</td><td class="r num">${fmt(r.s)}</td><td class="r num"><b>${fmt(r.c + r.s)}</b></td><td class="r num">${fmt(r.dev)}</td><td class="r num">${fmt(r.nothi)}</td></tr>`).join('')}
      <tr class="tot"><td>${L('মোট', 'Total')}</td><td class="r num">${fmt(tot.c)}</td><td class="r num">${fmt(tot.s)}</td><td class="r num">${fmt(tot.c + tot.s)}</td><td class="r num">${fmt(tot.dev)}</td><td class="r num">${fmt(tot.nothi)}</td></tr>
      </tbody></table></div></section>
    <section class="card"><h3>${L('অ্যাসাইনমেন্ট', 'Assignments')}</h3><dl class="kv">
      <dt>${L('মোট', 'Total')}</dt><dd class="num">${fmt(as.length)}</dd>
      <dt>${L('নতুন', 'New')}</dt><dd class="num">${fmt(as.filter(a => a.status === 'open').length)}</dd>
      <dt>${L('চলমান', 'In progress')}</dt><dd class="num">${fmt(as.filter(a => a.status === 'inprogress').length)}</dd>
      <dt>${L('সম্পন্ন', 'Done')}</dt><dd class="num">${fmt(as.filter(a => a.status === 'done').length)}</dd>
      <dt>${L('মেয়াদ পেরিয়েছে', 'Overdue')}</dt><dd class="num" style="color:var(--red)">${fmt(as.filter(isAOverdue).length)}</dd>
      <dt>${L('১ মাস পার রিপোর্ট', 'Reports over a month')}</dt><dd class="num" style="color:var(--red)">${fmt(sub.filter(([, r]) => isOverdue(r)).length)}</dd>
      <dt>${L('পুনঃপরিদর্শন দরকার', 'Revisit needed')}</dt><dd class="num">${fmt(sub.filter(([, r]) => r.revisit && r.revisit.v === 'yes').length)}</dd>
    </dl></section></div>`;
  $$('[data-gran]').forEach(b => b.onclick = () => { V.sgran = b.dataset.gran; render(); });
  $('#stZone').onchange = e => { V.szone = e.target.value; render(); };
  $('#stCsv').onclick = () => {
    const head = [gran === 'day' ? L('দিন', 'Day') : gran === 'month' ? L('মাস', 'Month') : L('বছর', 'Year'), L('অভিযোগভিত্তিক', 'Complaint'), L('স্বপ্রণোদিত', 'Self'), L('মোট', 'Total'), L('বিচ্যুতিসহ', 'With deviation'), L('নথি পেশ', 'Filed')];
    saveFile(`rajuk-stats-${gran}-${today()}.csv`, toCsv([head, ...V.statRows.map(r => [r.key, r.c, r.s, r.c + r.s, r.dev, r.nothi])]), 'text/csv');
  };
}

    'auth/user-not-found': L('এই ইমেইলে কোনো আইডি নেই', 'No account with this email'), 'auth/email-already-in-use': L('এই ইমেইলে আগেই আইডি খোলা আছে — লগইন করুন', 'Email already registered — sign in'),

    'auth/too-many-requests': L('অনেকবার চেষ্টা হয়েছে — কিছুক্ষণ পরে আবার চেষ্টা করুন', 'Too many attempts — try again later'),
    'auth/invalid-phone-number': L('ফোন নম্বর সঠিক নয় — যেমন 01712345678', 'Invalid phone — e.g. 01712345678'), 'auth/invalid-verification-code': L('কোড সঠিক নয়', 'Wrong code'),
    'auth/code-expired': L('কোডের মেয়াদ শেষ — আবার পাঠান', 'Code expired — send again'), 'auth/network-request-failed': L('ইন্টারনেট সংযোগ নেই', 'No internet connection') };
  toast(m[e && e.code] || L('সমস্যা হয়েছে — আবার চেষ্টা করুন', 'Something went wrong — try again'));
}
const bdPhone = s => { s = asciiDigits(s).replace(/[\s-]/g, ''); if (/^01\d{9}$/.test(s)) return '+88' + s; if (/^8801\d{9}$/.test(s)) return '+' + s; return s; };
/* শক্তিশালী পাসওয়ার্ড: কমপক্ষে ৮ অক্ষর, বড় হাতের, ছোট হাতের ও সংখ্যা */
const strongPw = p => p.length >= 8 && /[a-z]/.test(p) && /[A-Z]/.test(p) && /\d/.test(p);

    <div class="grid"><div class="f"><label class="l" for="aPw">${L('পাসওয়ার্ড', 'Password')}</label><input id="aPw" type="password" autocomplete="new-password" maxlength="128"></div>
    <div class="f"><label class="l" for="aPw2">${L('আবার পাসওয়ার্ড', 'Repeat')}</label><input id="aPw2" type="password" autocomplete="new-password" maxlength="128"></div></div>

    <div class="acts"><button class="btn pri block" id="aSend">${L('কোড পাঠান', 'Send code')}</button></div>

    <div class="acts"><button class="btn pri" id="aVerify">${L('যাচাই করে ঢুকুন', 'Verify')}</button><button class="btn" id="aBack">${L('নম্বর বদলান', 'Change number')}</button></div>`;
  $('#content').innerHTML = `<div class="authwrap"><div class="authcard">

}
